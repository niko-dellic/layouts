<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/demos/style.css" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Layouts — React workspace</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body class="demo-page">
    <header class="demo-top">
      <a href="/" class="brand"
        ><img class="brand-icon" src="/android-chrome-192x192.png" width="29" height="29" alt="" />
        layouts<span class="version">0.1</span></a
      >
      <nav aria-label="Demo framework">
        <a href="/vanilla.html">Vanilla TS</a><a href="/react.html" aria-current="page">React</a>
      </nav>
      <div class="demo-actions" aria-label="Workspace controls">
        <button id="json-open">Layout JSON</button>
        <button id="reset">Reset</button>
      </div>
      <a class="source-link" href="https://github.com/niko-dellic/layouts">GitHub ↗</a>
    </header>
    <main class="demo-main">
      <div id="workspace"></div>
    </main>
    <dialog id="json-dialog" class="json-dialog">
      <h2>Workspace configuration</h2>
      <p>Edit and load the workspace layout as JSON.</p>
      <textarea id="layout-json" aria-label="Layout JSON" spellcheck="false"></textarea>
      <p id="json-error" role="alert"></p>
      <div class="demo-actions">
        <button id="json-cancel">Cancel</button><button id="json-load">Load layout</button>
      </div>
    </dialog>
    <script type="module" src="/demos/react.tsx"></script>
  </body>
</html>
